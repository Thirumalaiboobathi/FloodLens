[project]
name = "floodlens-geo"
version = "0.1.0"
description = "FloodLens geospatial processing engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "numpy",
  "scipy",
  "rasterio",
  "geopandas",
  "shapely>=2",
  "pyproj",
  "xarray",
  "networkx",
  "requests",
  "boto3",
  "h5netcdf",
  "h5py",
  "whitebox",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["floodlens_geo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
